<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>森之刃 · 动作检查台</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#111b20;color:#dce6e5}*{box-sizing:border-box}body{max-width:1500px;margin:0 auto;padding:22px}h1{font-size:24px;margin:0 0 6px;color:#f0d8a7}p{color:#9eb2b7;margin:8px 0 18px;line-height:1.6}main{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px}aside,.panel{background:#1a292f;border:1px solid #33454d;border-radius:10px;padding:16px}label{display:block;margin-bottom:16px;color:#c2d2d5}select,button,input{font:inherit}select,button{border:1px solid #506169;border-radius:6px;background:#263a43;color:#e5eeed;padding:9px}select{width:100%;margin-top:7px}button{cursor:pointer}button:hover{background:#385664}button:disabled{opacity:.4}input[type=range]{width:100%;accent-color:#f0c985}.check{display:flex;align-items:center;gap:8px;margin-bottom:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.toolbar select{width:auto;margin:0}.stage{position:relative;background:#172329;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:510px;touch-action:none}.stats{font:14px ui-monospace,monospace;color:#aaddcc;min-height:24px;margin-top:10px}.keys{display:flex;gap:6px;overflow:auto;padding:10px 0}.keys button{min-width:92px;padding:0 0 7px;background:#152127}.keys button.selected{border-color:#f4ce87}.keys canvas{height:105px;width:100px}.small{font-size:12px;color:#9eb2b7;line-height:1.6}.status{color:#edca89;min-height:48px}.timeline{margin:12px 0}.legend{display:flex;gap:14px;font-size:13px;margin-top:5px}.tag{padding:3px 8px;border-radius:4px;background:#344b57}.review{margin-top:14px;padding-top:12px;border-top:1px solid #40515a}a{color:#a4ddd0}.error{color:#ff9d91}@media(max-width:850px){main{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap;gap:12px}aside label{min-width:130px;flex:1}canvas{height:420px}}
</style>
<h1>森之刃 · 动作检查台</h1>
<p>先看握持、腿部交替、重心与收势，再验证命中。空格播放/暂停，← → 单步，Shift + ← → 切关键姿势。这里直接读取游戏图集与导出的时间轴。</p>
<main><aside>
<label>武器<select id="weapon"></select></label><label>动作<select id="clip"></select></label><label>朝向<select id="direction"></select></label>
<label class="check"><input id="four" type="checkbox">八方向并排</label>
<label class="check"><input id="ghost" type="checkbox">前后关键帧叠影</label>
<label class="check"><input id="grid" type="checkbox" checked>脚底线与参照网格</label>
<label>放大倍率 <output id="zoomValue">1.6</output><input id="zoom" type="range" min="0.7" max="2.6" step="0.1" value="1.6"></label>
<div class="review"><b>握持标注</b><p class="small">暂停后选择点位，再点击画面中的真实位置。标注保存在本机浏览器，可导出。数值检查使用人工标注，不能替代视觉判断。</p>
<label>点位<select id="mark"><option value="">关闭标注</option><option value="butt">枪尾</option><option value="rear">后手</option><option value="fore">前手</option><option value="tip">枪尖</option></select></label>
<button id="export">导出标注</button><button id="clear">清除此帧</button><p id="grip" class="status small"></p></div>
</aside><section class="panel">
<div class="toolbar"><button id="play">暂停</button><button id="previous">← 单步</button><button id="next">单步 →</button><button id="reset">回到起点</button><select id="speed" aria-label="播放速度"><option value="0.1">0.1 倍</option><option value="0.25">0.25 倍</option><option value="0.5">0.5 倍</option><option value="1" selected>正常速度</option><option value="2">2 倍</option></select></div>
<div class="stage"><canvas id="stage"></canvas></div><div id="stats" class="stats"></div>
<div class="timeline"><input id="timeline" aria-label="动作时间轴" type="range" min="0" max="1" step="0.0001" value="0"><div class="legend"><span class="tag">前摇</span><span class="tag" style="background:#785735">命中</span><span class="tag">收招</span></div></div>
<div id="keys" class="keys"></div><p id="caption" class="small"></p>
<p class="small">这个检查台播放原始关键帧，不插入虚构姿势。特殊动作只检查身体姿态；位移、墙体遮挡、敌人反应与特效仍用实机验证。修改游戏时间轴后运行 tools/animation-lab 重新导出。</p>
</section></main>
<script src="animation-lab-data.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), data=window.MOTION_DATA, stage=$('stage'), ctx=stage.getContext('2d'), images=new Map(), layerBuffers=new Map();
if(!data)throw new Error('先运行 tools/animation-lab 导出游戏动作数据');
const state={playing:true,time:0,last:0,keys:[],layouts:[],marks:JSON.parse(localStorage.getItem('forest-motion-marks')||'{}')};
Object.entries(data.weapons).forEach(([id,w])=>$('weapon').add(new Option(w.name,id)));$('weapon').value='thunder';
Object.entries(data.clips).forEach(([id,name])=>$('clip').add(new Option(name,id)));$('clip').value='run';
data.directions.forEach((name,index)=>$('direction').add(new Option(name,index)));$('direction').value='2';
function clip(dir=+$('direction').value){return data.weapons[$('weapon').value].clips[$('clip').value][dir]}
function sample(t=state.time,dir=+$('direction').value){const c=clip(dir);return c.samples[Math.min(120,Math.max(0,Math.floor(t/c.duration*120)))];}
function image(path){if(!images.has(path)){const img=new Image();img.onload=()=>{render();redrawKeys();};img.onerror=()=>{$('caption').textContent='图集加载失败：'+path;$('caption').classList.add('error')};img.src=path;images.set(path,img)}return images.get(path)}
function signature(s){return s.layers?JSON.stringify(s.layers.map(p=>[p.path,p.rect,p.flip])):[s.path,s.row,s.column,s.flip].join('|')}
function annotationKey(s){return [s.path,s.row,s.column,s.layers?'view'+s.direction:'atlas'].join('|')}
function persist(){localStorage.setItem('forest-motion-marks',JSON.stringify(state.marks))}
function buildKeys(){const samples=clip().samples;state.keys=[];let last='';samples.forEach(s=>{if(signature(s)!==last){state.keys.push(s);last=signature(s)}});$('keys').replaceChildren();state.keys.forEach(s=>{const b=document.createElement('button'), c=document.createElement('canvas');c.width=200;c.height=210;b.append(c,document.createTextNode(`${Math.round(s.time*1000)} 毫秒`));b.onclick=()=>{state.playing=false;state.time=s.time+0.00001;render()};$('keys').append(b);const img=image(s.path);const draw=()=>{const g=c.getContext('2d');g.clearRect(0,0,200,210);drawSprite(g,img,s,100,185,0.64,1)};if(img.complete)draw();else img.addEventListener('load',draw,{once:true})})}
function redrawKeys(){state.keys.forEach((s,i)=>{const c=$('keys').children[i]?.querySelector('canvas');if(!c)return;const g=c.getContext('2d');g.clearRect(0,0,200,210);drawSprite(g,image(s.path),s,100,185,.64,1)})}
function fadedLayer(part,im){const key=part.path+JSON.stringify(part.rect)+part.fade;if(layerBuffers.has(key))return layerBuffers.get(key);const c=document.createElement('canvas');c.width=part.rect[2];c.height=part.rect[3];const g=c.getContext('2d');g.drawImage(im,...part.rect,0,0,c.width,c.height);g.globalCompositeOperation='destination-in';const mask=g.createLinearGradient(0,0,0,c.height);if(part.fade==='none'){layerBuffers.set(key,c);return c}if(part.fade==='top'){mask.addColorStop(0,'#0000');mask.addColorStop(16/c.height,'#000');mask.addColorStop(1,'#000')}else{mask.addColorStop(0,'#000');mask.addColorStop(1-20/c.height,'#000');mask.addColorStop(1,'#0000')}g.fillStyle=mask;g.fillRect(0,0,c.width,c.height);layerBuffers.set(key,c);return c}
function drawSprite(g,img,s,x,y,z,alpha){if(s.layers){for(const part of s.layers){const im=image(part.path);if(!im.complete||!im.naturalWidth)continue;g.save();g.globalAlpha=alpha;g.translate(x,y);g.scale((part.flip?-1:1)*z,z);g.drawImage(fadedLayer(part,im),...part.position);g.restore()}return}if(!img.complete||!img.naturalWidth)return;g.save();g.globalAlpha=alpha;g.translate(x,y);g.scale((s.flip?-1:1)*z,z);g.drawImage(img,s.column*s.cell,s.row*s.cell,s.cell,s.cell,-s.cell/2,-s.baseline,s.cell,s.cell);g.restore()}
function drawPanel(x,y,w,h,dir){const s=sample(state.time,dir),b=clip(dir).bounds,z=Math.min(+$('zoom').value,(w-40)/(b[2]-b[0]),(h-70)/(b[3]-b[1])),fx=x+w/2-(b[0]+b[2])*z/2,fy=y+h/2-(b[1]+b[3])*z/2+12;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='#172329';ctx.fillRect(x,y,w,h);if($('grid').checked){ctx.strokeStyle='#253a42';ctx.lineWidth=1;for(let q=x;q<x+w;q+=40){ctx.beginPath();ctx.moveTo(q,y);ctx.lineTo(q,y+h);ctx.stroke()}for(let q=y;q<y+h;q+=40){ctx.beginPath();ctx.moveTo(x,q);ctx.lineTo(x+w,q);ctx.stroke()}ctx.strokeStyle='#70988f';ctx.beginPath();ctx.moveTo(x,fy);ctx.lineTo(x+w,fy);ctx.stroke();ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(fx,y);ctx.lineTo(fx,y+h);ctx.stroke();ctx.setLineDash([])}
if($('ghost').checked){const all=clip(dir).samples,i=Math.floor(state.time/clip(dir).duration*120);let p=i-1,n=i+1;while(p>0&&signature(all[p])===signature(s))p--;while(n<120&&signature(all[n])===signature(s))n++;[all[Math.max(0,p)],all[Math.min(120,n)]].forEach(q=>drawSprite(ctx,image(q.path),q,fx,fy,z,.18))}
drawSprite(ctx,image(s.path),s,fx,fy,z,1);ctx.fillStyle=s.phase==='命中'?'#ffd19b':'#d6e6e5';ctx.font='15px system-ui';ctx.fillText(`${data.directions[dir]} · ${s.phase}`,x+16,y+25);
const marks=state.marks[annotationKey(s)]||{},colors={butt:'#ec84bf',rear:'#ffc765',fore:'#8addc7',tip:'#8bbdff'};Object.entries(marks).forEach(([name,p])=>{const mx=fx+(p[0]-s.cell/2)*z*(s.flip?-1:1),my=fy+(p[1]-s.baseline)*z;ctx.fillStyle=colors[name];ctx.beginPath();ctx.arc(mx,my,5,0,Math.PI*2);ctx.fill();ctx.fillText({butt:'枪尾',rear:'后手',fore:'前手',tip:'枪尖'}[name],mx+8,my-6)});state.layouts.push({x,y,w,h,fx,fy,z,s});ctx.restore()}
function render(){stage.style.height=$('four').checked?'1500px':'510px';const box=stage.getBoundingClientRect(),ratio=devicePixelRatio||1;if(stage.width!==Math.round(box.width*ratio))stage.width=Math.round(box.width*ratio);if(stage.height!==Math.round(box.height*ratio))stage.height=Math.round(box.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);state.layouts=[];if($('four').checked){for(let i=0;i<data.directions.length;i++)drawPanel((i%2)*box.width/2,Math.floor(i/2)*box.height/4,box.width/2,box.height/4,i)}else drawPanel(0,0,box.width,box.height,+$('direction').value);const s=sample();$('timeline').max=clip().duration;$('timeline').value=state.time;$('play').textContent=state.playing?'暂停':'播放';$('stats').textContent=`${Math.round(state.time*1000)} / ${Math.round(clip().duration*1000)} 毫秒 · 第 ${s.combo} 段 · ${s.phase} · ${s.layers?`腿部帧 ${s.layers[0].rect[0]/320+1} · 上身固定`:`图集行 ${s.row+1} 帧 ${s.column+1}`}`;$('zoomValue').value=(+$('zoom').value).toFixed(1);$('caption').textContent=(s.layers?'上身：'+s.layers[1].path.replace('../','')+' · 腿部：'+s.layers[0].path.replace('../',''):s.path.replace('../',''))+(s.reach?` · 攻击距离 ${s.reach.toFixed(2)}（游戏世界单位）`:'');[...$('keys').children].forEach((b,i)=>b.classList.toggle('selected',signature(state.keys[i])===signature(s)));const m=state.marks[annotationKey(s)];if(m&&['butt','rear','fore','tip'].every(k=>m[k])){const v=[m.tip[0]-m.butt[0],m.tip[1]-m.butt[1]],l=v[0]**2+v[1]**2,percent=p=>((p[0]-m.butt[0])*v[0]+(p[1]-m.butt[1])*v[1])/l;const a=percent(m.rear),b=percent(m.fore);$('grip').textContent=`后手 ${(a*100).toFixed(0)}% · 前手 ${(b*100).toFixed(0)}%（从枪尾计）。${a<=.2&&b<=.4?'握点位于后段。':'检查是否又回到中段握持。'}`}else $('grip').textContent='可标注枪尾、双手和枪尖，量化握点，避免仅凭测试通过判断动作正确。'}
function change(){state.time=0;buildKeys();render()}
function step(delta){state.playing=false;state.time=Math.max(0,Math.min(clip().duration-0.00001,state.time+delta));render()}
['weapon','clip','direction'].forEach(id=>$(id).onchange=change);['four','ghost','grid','zoom'].forEach(id=>$(id).oninput=render);$('play').onclick=()=>{state.playing=!state.playing;render()};$('previous').onclick=()=>step(-1/60);$('next').onclick=()=>step(1/60);$('reset').onclick=()=>{state.time=0;render()};$('timeline').oninput=()=>{state.playing=false;state.time=+$('timeline').value;render()};$('mark').onchange=()=>{if($('mark').value)state.playing=false;render()};
stage.onclick=e=>{const name=$('mark').value;if(!name)return;const rect=stage.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,p=state.layouts.find(p=>x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h);if(!p)return;const key=annotationKey(p.s);state.marks[key]||={};state.marks[key][name]=[Math.round(p.s.cell/2+(x-p.fx)/p.z*(p.s.flip?-1:1)),Math.round(p.s.baseline+(y-p.fy)/p.z)];persist();render()};
$('clear').onclick=()=>{delete state.marks[annotationKey(sample())];persist();render()};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.marks,null,2)],{type:'application/json'}));a.download='motion-grip-annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(['ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();if(e.shiftKey){const all=state.keys.filter(s=>e.code==='ArrowRight'?s.time>state.time+.0001:s.time<state.time-.0001);const s=e.code==='ArrowRight'?all[0]:all.at(-1);if(s){state.playing=false;state.time=s.time+.00001;render()}}else step(e.code==='ArrowRight'?1/60:-1/60)}});
function loop(now){if(state.playing){state.time=(state.time+Math.min(.1,(now-state.last)/1000)*+$('speed').value)%clip().duration;render()}state.last=now;requestAnimationFrame(loop)}
const query=new URLSearchParams(location.search);for(const key of ['weapon','clip','direction'])if(query.has(key))$(key).value=query.get(key);$('four').checked=query.has('four');state.playing=!query.has('paused');state.time=+(query.get('t')||0);addEventListener('resize',render);buildKeys();render();requestAnimationFrame(loop);
</script><script src="verify-animation-lab.js"></script></html>
